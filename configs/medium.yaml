# SUSA AURA — Medium Experiment Configuration
# Intended for GPU memory and throughput benchmarking before target 1B scale.
# Parameter count: ~222M parameters.

profile_name: "medium"
description: "Medium profile for benchmarking throughput and scaling on Colab / medium cloud GPUs."

model:
  vocab_size: 32000
  max_seq_len: 1024
  d_model: 1024
  n_heads: 16
  n_kv_heads: 8
  n_layers: 16
  d_ff: 2816
  norm_eps: 1.0e-5
  rope_theta: 10000.0
  tie_word_embeddings: true
  dropout: 0.0

training:
  batch_size: 4
  grad_accum_steps: 8
  lr: 0.0004
  min_lr: 0.00004
  warmup_steps: 1000
  max_steps: 25000
  weight_decay: 0.1
  grad_clip: 1.0
  mixed_precision: "fp16"
  seed: 42

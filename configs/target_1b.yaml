# SUSA-1B CodeMind — Target 1B Model Configuration
# Full architecture target: ~1.01 Billion parameters.
# Enabled only after resource validation, benchmark checks, and memory profiling.

profile_name: "target_1b"
description: "The primary 1-billion parameter decoder-only Transformer for SUSA-1B CodeMind."

model:
  vocab_size: 32000
  max_seq_len: 2048
  d_model: 2048
  n_heads: 16
  n_kv_heads: 8            # Grouped-Query Attention (GQA) for memory-efficient KV cache
  n_layers: 20             # 20 Transformer decoder layers (~1.009B total parameters)
  d_ff: 5632               # SwiGLU hidden dimension (~8/3 * d_model rounded to multiple of 256)
  norm_eps: 1.0e-5
  rope_theta: 10000.0
  tie_word_embeddings: true # Tied input embeddings and output lm_head
  dropout: 0.0

training:
  batch_size: 1            # Micro-batch size of 1 for 1B parameter memory fitting
  grad_accum_steps: 16     # Effective batch size: 16 sequences (16,384 tokens per optimizer step)
  lr: 0.0003
  min_lr: 0.00003
  warmup_steps: 500
  max_steps: 100000
  weight_decay: 0.1
  grad_clip: 1.0
  mixed_precision: "fp16"  # Fast FP16 tensor cores on NVIDIA T4
  seed: 42
  gradient_checkpointing: true # Essential for 1B model: saves 70% activation memory
  use_8bit_adam: true          # Reduces optimizer states from 11.28 GB to 2.82 GB

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "susa-aura"
version = "0.1.0"
description = "SUSA AURA: Adaptive Universal Reasoning Assistant — An original Transformer language model and intelligent assistant runtime built from scratch."
readme = "README.md"
authors = [
    { name = "SUSA Ecosystem" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = [
    "transformer",
    "llm",
    "deep-learning",
    "reasoning-assistant",
    "code-generation",
    "pytorch",
    "susa",
    "aura"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Code Generators"
]

dependencies = [
    "torch>=2.0.0",
    "pyyaml>=6.0.0",
    "psutil>=5.9.0",
    "tokenizers>=0.19.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]
colab = [
    "tqdm>=4.66.0",
    "wandb>=0.16.0",
]

[project.scripts]
aura = "aura.interface.cli:main"
susa-aura = "aura.interface.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aura*", "susacodemind*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
exclude = [
    ".venv",
    "venv",
    "data",
    "checkpoints",
    "logs",
    "tokenizer_cache",
    "notebooks",
]
line-length = 100

[tool.ruff.lint]
ignore = [
    "BLE001",  # blind-except (intended for resilient file and git inspection)
    "S110",    # try-except-pass (intended for optional metadata)
    "S112",    # try-except-continue (intended for file scanning)
]
